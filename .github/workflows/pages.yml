name: Deploy Sileo repository to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate APT repository
        run: |
          test -s site/Packages
          test -s site/Packages.gz
          test -s site/Release
          test -s site/pool/main/com.demiany.graviapps_1.0.0-8_iphoneos-arm64.deb
          test -s site/pool/main/com.glyphtime.tweak_1.1.8_iphoneos-arm64.deb
          grep -q 'Version: 1.0.0-8' site/Packages
          grep -q 'Version: 1.1.8' site/Packages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
